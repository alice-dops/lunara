id: 01-ratio
name: Ratio
icon: monitor
queryVars:
  cmd: sh
  args:
    - -c
    - |
      if xrandr --query | grep -q "HDMI-1 connected 1920x1080"; then
          echo '{"name":"Ratio: 2k"}'
      else
          echo '{"name":"Ratio: 4k"}'
      fi
executor:
  - actionButton: A
    cmd: sh
    args:
      - -c
      - |
        if xrandr --query | grep -q "HDMI-1 connected 1920x1080"; then
          xrandr --output HDMI-1 --mode "1920x1080"
        else
          xrandr --output HDMI-1 --mode "3840x2160"
        fi

